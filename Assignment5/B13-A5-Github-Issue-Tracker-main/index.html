<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .issue-card {
            transition: all 0.3s ease;
        }
        
        .issue-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .open-border {
            border-top: 4px solid #10b981;
        }
        
        .closed-border {
            border-top: 4px solid #8b5cf6;
        }
        
        .tab-active {
            background-color: #3b82f6;
            color: white;
        }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Login Page -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <div class="text-center mb-8">
                <img src="assets/github-logo.png" alt="GitHub Logo" class="w-16 h-16 mx-auto mb-4">
                <h1 class="text-2xl font-bold text-gray-800">GitHub Issues Tracker</h1>
                <p class="text-gray-600 mt-2">Sign in to manage your issues</p>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 p-4 bg-gray-50 rounded-md">
                <h3 class="text-sm font-semibold text-gray-700 mb-2">Demo Credentials</h3>
                <p class="text-sm text-gray-600">Username: admin</p>
                <p class="text-sm text-gray-600">Password: admin123</p>
            </div>
        </div>
    </div>

    <!-- Main Page -->
    <div id="mainPage" class="hidden">
        <!-- Navbar -->
        <nav class="bg-white shadow-md px-4 sm:px-6 py-4">
            <div class="flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0">
                <div class="flex items-center space-x-4">
                    <img src="assets/github-logo.png" alt="GitHub Logo" class="w-8 h-8">
                    <h1 class="text-lg sm:text-xl font-bold text-gray-800">GitHub Issues Tracker</h1>
                </div>
                
                <div class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-2 w-full sm:w-auto">
                    <input type="text" id="searchInput" placeholder="Search issues..." class="w-full sm:w-auto px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="newIssueBtn" class="w-full sm:w-auto bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition duration-200">
                        + New Issue
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mx-auto px-4 sm:px-6 py-8">
            <!-- Tab Section -->
            <div class="mb-8">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4 space-y-4 sm:space-y-0">
                    <div class="flex space-x-1 sm:space-x-4">
                        <button class="tab-btn px-3 sm:px-4 py-2 rounded-md bg-blue-600 text-white font-medium text-sm sm:text-base" data-tab="all">All</button>
                        <button class="tab-btn px-3 sm:px-4 py-2 rounded-md bg-gray-200 text-gray-700 font-medium text-sm sm:text-base" data-tab="open">Open</button>
                        <button class="tab-btn px-3 sm:px-4 py-2 rounded-md bg-gray-200 text-gray-700 font-medium text-sm sm:text-base" data-tab="closed">Closed</button>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                        <span class="text-sm sm:text-base text-gray-600">Open</span>
                        <div class="w-3 h-3 bg-purple-500 rounded-full ml-2 sm:ml-4"></div>
                        <span class="text-sm sm:text-base text-gray-600">Closed</span>
                    </div>
                </div>
                
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-2 sm:space-y-0">
                    <div class="flex items-center space-x-2">
                        <div class="w-7 h-7 rounded-full border-2 border-purple-300 bg-gradient-to-br from-purple-100 to-purple-200 flex items-center justify-center shadow-sm">
                            <img src="assets/Aperture.png" alt="Issues Icon" class="w-4 h-4">
                        </div>
                        <span id="issueCount" class="text-lg sm:text-xl font-semibold text-gray-800">0 issues</span>
                    </div>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="flex justify-center items-center py-12">
                <div class="loading-spinner"></div>
            </div>

            <!-- Issues Grid -->
            <div id="issuesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 max-w-7xl mx-auto">
                <!-- Issues will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Issue Details Modal -->
    <div id="issueModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg p-4 sm:p-6 w-full max-w-2xl max-h-[90vh] sm:max-h-[80vh] overflow-y-auto">
            <div class="mb-4">
                <h2 id="modalTitle" class="text-lg sm:text-xl font-bold text-gray-800"></h2>
            </div>
            
            <div id="modalContent" class="space-y-4">
                <!-- Modal content will be loaded here -->
            </div>
            
            <div class="mt-6 flex justify-end">
                <button id="closeModalBtn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition duration-200">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
